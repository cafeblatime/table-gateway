<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe QR Gateway</title>

  <!-- ================================================================= -->
  <!-- 🎨 SECTION 1: STYLES & VISUAL DESIGNS (<style>)                   -->
  <!-- ================================================================= -->
  <style>
    body { font-family: system-ui, sans-serif; background: #1800ad; color: #FAF9F6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #FAF9F6; color: #1800ad; padding: 2rem; border-radius: 16px; text-align: center; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .btn { background: #2E7D32; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- ================================================================= -->
  <!-- 🏗️ SECTION 2: PAGE STRUCTURE & HTML ELEMENTS                    -->
  <!-- ================================================================= -->
  <div class="card" id="statusCard">
    <h2>Connecting...</h2>
    <p>Checking table availability.</p>
  </div>

  <!-- ================================================================= -->
  <!-- ⚙️ SECTION 3: APPLICATION LOGIC (<script>)                       -->
  <!-- ================================================================= -->
  <script>
    /* ----------------------------------------------------------------- */
    /* 3A. Key Links & Web Addresses                                     */
    /* ----------------------------------------------------------------- */
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjQtbuew_onZqKqSEO49KeMQwIwm-t5VBwwSC1l8XcBE-7bWcjcnUDS4Jv9lNHgC2HbQ/exec";
    const TALLY_BASE_URL = "https://tally.so/r/aQqkWX"; 

    /* ----------------------------------------------------------------- */
    /* 3B. User ID Generator & Local Storage                             */
    /* ----------------------------------------------------------------- */
    function getOrCreateUserId() {
      let uid = localStorage.getItem("focus_user_id");
      if (!uid) {
        uid = "USR-" + Math.random().toString(36).substr(2, 6).toUpperCase();
        localStorage.setItem("focus_user_id", uid);
      }
      return uid;
    }

    /* ----------------------------------------------------------------- */
    /* 3C. Session Parity State Helper (ADDED)                            */
    /* Calculates even (true) vs uneven (false) session number           */
    /* ----------------------------------------------------------------- */
    function getEvenUnevenState(table) {
      let countKey = 'renewal_count_' + table;
      let renewalCount = parseInt(localStorage.getItem(countKey) || '0', 10);
      return (renewalCount % 2 === 0);
    }

    /* ----------------------------------------------------------------- */
    /* 3D. Gateway Logic & Table Verification                             */
    /* ----------------------------------------------------------------- */
    async function processGateway() {
      const urlParams = new URLSearchParams(window.location.search);
      const table = urlParams.get("table") || "1";
      const userId = getOrCreateUserId();
      
      // Calculate even_uneven state (FIX 1)
      const evenUneven = getEvenUnevenState(table);

      // Build target Tally URL including even_uneven parameter (FIX 2)
      const tallyUrl = `${TALLY_BASE_URL}?table=${table}&client_token=${userId}&even_uneven=${evenUneven}`;

      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?action=checkUser&table=${table}&client=${userId}`);
        const data = await res.json();

        if (data.occupied) {
          document.getElementById("statusCard").innerHTML = `
            <h2 style="color: #D32F2F;">Table Occupied</h2>
            <p>Table ${table} currently has an active focus session registered to another guest.</p>
            <p>Please check your table number or ask counter staff for assistance.</p>
          `;
        } else {
          // Send user to Tally with table, client_token, and even_uneven
          window.location.href = tallyUrl;
        }
      } catch (err) {
        document.getElementById("statusCard").innerHTML = `
          <h2>Connection Error</h2>
          <p>Could not verify table status. Proceeding to order form...</p>
          <a href="${tallyUrl}" class="btn">Continue to Order</a>
        `;
      }
    }

    /* ----------------------------------------------------------------- */
    /* 3E. Automatic Start on Page Load                                 */
    /* ----------------------------------------------------------------- */
    window.addEventListener("DOMContentLoaded", processGateway);
  </script>
</body>
</html>
