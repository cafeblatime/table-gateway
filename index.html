<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preparing Session...</title>
  <style>
    :root {
      --bg-color: #0F2C59; /* Main background: Dark Royal Blue */
      --card-bg: #FAF9F6; /* Off-white container */
      --royal-blue: #0F2C59;
      --text-main: #0F2C59;
      --text-muted: #5A6B82;
      --border-color: #E2E8F0;
      --accent-red: #D32F2F;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: var(--bg-color); 
      color: var(--text-main); 
      text-align: center; 
      padding: 20px; 
      margin: 0; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }

    .card { 
      background: var(--card-bg); 
      border-radius: 20px; 
      padding: 28px 24px; 
      max-width: 360px; 
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); 
    }

    .spinner { 
      font-size: 1rem; 
      color: var(--royal-blue); 
      font-weight: 600;
      letter-spacing: 0.5px; 
    }

    .error-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-red);
      margin-bottom: 12px;
    }

    .error-msg {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .btn { 
      background: var(--royal-blue); 
      color: #FFFFFF; 
      border: none; 
      padding: 14px 20px; 
      font-size: 1rem; 
      font-weight: 600; 
      border-radius: 12px; 
      cursor: pointer; 
      width: 100%; 
      text-decoration: none;
      display: inline-block;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div id="card" class="card">
    <div class="spinner">Preparing your table session...</div>
  </div>

  <script>
    async function initGateway() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawTable = urlParams.get('table') || urlParams.get('Table') || '1';
      const tableNum = rawTable.replace(/[^0-9]/g, '') || '1';
      
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2MY_qM4p18RYNwn0a8DX_FGQMdMNyJ4q6b8TnZSnVscOGiUIIPjh0xRaZFvZleMh0Mw/exec";
      
      try {
        let response = await fetch(`${SCRIPT_URL}?action=check&table=${tableNum}`);
        let data = await response.json();
        let status = data.status || "Open";
        
        // If the table status is NOT "Open", block access immediately
        if (status.toLowerCase() !== "open") {
          renderOccupiedUI(tableNum);
        } else {
          window.location.replace(`https://tally.so/r/aQqkWX?table=${tableNum}&status=${status}`);
        }
      } catch (err) {
        console.error("Gateway error", err);
        // Fallback option in case network/script check fails
        window.location.replace(`https://tally.so/r/aQqkWX?table=${tableNum}&status=Open`);
      }
    }

    function renderOccupiedUI(tableNum) {
      const card = document.getElementById('card');
      card.innerHTML = `
        <div class="error-title">Table ${tableNum} is Occupied</div>
        <div class="error-msg">This table currently has an active focus session. Please choose a different table to continue.</div>
        <button class="btn" onclick="window.location.reload()">🔄 Re-check Status</button>
      `;
    }
    
    initGateway();
  </script>
</body>
</html>
